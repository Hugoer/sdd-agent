# Dev database. Data lives in the named volume: it survives stop/start, restart,
# down/up and a Docker restart. Only `docker compose down -v` deletes it.
name: sdd-agent

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdd_agent
      POSTGRES_PASSWORD: sdd_agent
      POSTGRES_DB: sdd_agent
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sdd_agent -d sdd_agent']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
